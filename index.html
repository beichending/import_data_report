<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进口图表汇总</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #fff; color: #003b68; font-family: Arial, "Microsoft YaHei", sans-serif; }
.page { max-width: 1500px; margin: 0 auto; padding: 18px 22px 32px; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; padding: 8px 0 14px; background: rgba(255,255,255,.96); border-bottom: 1px solid #d8e0e8; }
h1 { margin: 0; font-size: 24px; font-weight: 500; color: #003b68; }
nav { display: flex; gap: 10px; flex-wrap: wrap; }
nav a { color: #003b68; text-decoration: none; border: 1px solid #d8e0e8; padding: 7px 12px; font-size: 14px; background: #fff; }
.top-tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.tool-button { min-width: 92px; height: 34px; border: 1px solid #9fb1bd; background: #fff; color: #003b68; padding: 0 13px; font: inherit; font-size: 14px; cursor: pointer; }
.tool-button:hover { background: #eef4f7; border-color: #54778d; }
.tool-button.primary { border-color: #0b4a75; background: #0b4a75; color: #fff; }
.tool-button.primary:hover { background: #073b5c; }
.history-panel { display: flex; align-items: center; gap: 10px; flex-basis: 100%; padding: 10px 12px; background: #f3f6f7; border: 1px solid #d3dee4; color: #315065; font-size: 13px; }
.history-panel[hidden] { display: none; }
.history-panel label { font-weight: 600; }
.history-panel input { height: 32px; border: 1px solid #9fb1bd; background: #fff; color: #223844; padding: 0 8px; font: inherit; }
.history-status { margin-left: auto; color: #62737d; }
.product { padding-top: 28px; scroll-margin-top: 76px; }
.product + .product { margin-top: 18px; }
.product h2 { margin: 0 0 22px; padding: 2px 0 12px 16px; border-left: 4px solid #0b4a75; border-bottom: 1px solid #d8e0e8; color: #073b5c; font-size: 32px; line-height: 1.2; font-weight: 650; }
.grid { display: grid; grid-template-columns: 220px 420px minmax(560px, 1fr); gap: 22px; }
.panel { min-width: 0; }
.panel + .panel { border-left: 1px solid #003b68; padding-left: 22px; }
.title { height: 36px; font-size: 21px; line-height: 1.2; color: #222; white-space: nowrap; }
.chart { width: 100%; height: 520px; }
.rolling-panel { margin-top: 22px; padding-top: 18px; border-top: 1px solid #003b68; }
.rolling-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.rolling-title { font-size: 21px; line-height: 1.2; color: #222; }
.rolling-period { color: #66757f; font-size: 13px; white-space: nowrap; }
.rolling-table-wrap { margin-top: 14px; overflow-x: auto; border: 1px solid #63736d; background: #fff; }
.rolling-table { width: 100%; min-width: 1180px; border-collapse: separate; border-spacing: 0; table-layout: fixed; color: #17231f; font-size: 15px; }
.rolling-table th, .rolling-table td { height: 34px; padding: 5px 9px; border-right: 1px solid rgba(48,65,59,.55); border-bottom: 1px solid rgba(48,65,59,.45); }
.rolling-table th:last-child, .rolling-table td:last-child { border-right: 0; }
.rolling-table tbody tr:last-child td { border-bottom: 0; }
.rolling-table thead th { color: #fff; text-align: center; font-size: 16px; line-height: 1.15; }
.rolling-table thead .summary-head { position: sticky; left: 0; z-index: 4; width: 245px; background: #305a4b; font-size: 17px; }
.rolling-table thead .period-head { height: 38px; font-weight: 700; }
.rolling-table thead .subhead { height: 31px; font-size: 15px; }
.rolling-table .tone-previous { background: #b45f38; }
.rolling-table .tone-latest { background: #39796e; }
.rolling-table .tone-change-previous { background: #aa7a19; }
.rolling-table .tone-change-latest { background: #8d6b20; }
.rolling-table .country-cn { position: sticky; left: 0; z-index: 2; width: 92px; text-align: right; background: #f3f6f2; font-size: 16px; }
.rolling-table .country-en { position: sticky; left: 92px; z-index: 2; width: 153px; text-align: center; background: #e5efdf; box-shadow: 2px 0 0 rgba(48,65,59,.3); font-size: 16px; }
.rolling-table .value-previous { background: #faece4; }
.rolling-table .value-latest { background: #e8f2ec; }
.rolling-table .change-previous { background: #fff4d2; }
.rolling-table .change-latest { background: #fdf2d6; }
.rolling-table .metric { text-align: right; font-variant-numeric: tabular-nums; }
.rolling-table .percent { font-style: italic; }
.rolling-table .share-cell { position: relative; overflow: hidden; }
.rolling-table .share-cell::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: var(--share); opacity: .58; border-right: 1px solid rgba(30,80,64,.4); }
.rolling-table .share-cell.value-previous::before { background: #e78370; }
.rolling-table .share-cell.value-latest::before { background: #71c395; }
.rolling-table .share-cell span { position: relative; z-index: 1; }
.rolling-table .group-row td { border-top: 1.5px solid #33453e; font-weight: 700; }
.rolling-table .group-row:first-child td { border-top: 0; }
.rolling-table .positive { color: #205f50; }
.rolling-table .negative { color: #9a463c; }
.country-trend-panel { margin-top: 26px; padding-top: 18px; border-top: 1px solid #003b68; }
.country-trend-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; flex-wrap: wrap; }
.country-trend-title { color: #003b68; font-size: 22px; font-weight: 600; }
.country-trend-legend { display: flex; align-items: center; justify-content: flex-end; gap: 20px; flex-wrap: wrap; color: #234760; font-size: 14px; }
.country-trend-legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend-bar { width: 20px; height: 13px; background: #0b4a75; }
.legend-line { width: 24px; height: 0; border-top: 3px solid #555b60; }
.legend-average { color: #b27a00; font-size: 20px; font-weight: 700; line-height: 1; }
.country-trend-scroll { margin-top: 14px; overflow-x: auto; border-top: 1px solid #87a1b3; border-bottom: 1px solid #87a1b3; }
.country-trend-board { min-width: 1080px; }
.country-trend-columns, .country-trend-row { display: grid; grid-template-columns: 94px 150px minmax(610px, 1fr) 104px 90px; }
.country-trend-columns { min-height: 34px; align-items: center; background: #f2f5f6; color: #315065; font-size: 13px; font-weight: 700; text-align: center; border-bottom: 1px solid #87a1b3; }
.country-trend-row { min-height: 238px; border-bottom: 1px solid #87a1b3; }
.country-trend-row:last-child { border-bottom: 0; }
.trend-country, .trend-brands, .trend-kpi { display: flex; align-items: center; justify-content: center; border-right: 1px solid #d1dce3; }
.trend-country { color: #234760; font-size: 17px; font-weight: 700; }
.trend-brands { flex-direction: column; gap: 4px; color: #36464f; font-size: 15px; line-height: 1.2; }
.trend-main { min-width: 0; padding: 8px 2px 5px; border-right: 1px solid #d1dce3; }
.country-trend-chart { width: 100%; height: 176px; }
.year-average-strip { display: flex; margin: 0 58px 0 48px; border-top: 1px solid #cbd6dd; }
.year-average { min-width: 0; padding-top: 4px; text-align: center; border-right: 1px dashed #87a1b3; }
.year-average:last-child { border-right: 0; }
.year-average span { display: block; color: #315065; font-size: 12px; }
.year-average b { display: block; margin-top: 1px; color: #b27a00; font-size: 12px; font-weight: 600; white-space: nowrap; }
.trend-kpi { flex-direction: column; gap: 4px; color: #003b68; font-size: 16px; font-variant-numeric: tabular-nums; }
.trend-kpi.positive { color: #205f50; }
.trend-kpi.negative { color: #9a463c; }
.trend-kpi small { color: #6b7b85; font-size: 11px; font-weight: 400; }
.product-footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 28px; padding: 12px 2px 18px; border-top: 1px solid #d8e0e8; color: #66757f; font-size: 12px; }
@media (max-width: 1120px) {
  .grid { grid-template-columns: 1fr; }
  .panel + .panel { border-left: 0; border-top: 1px solid #003b68; padding-left: 0; padding-top: 18px; }
  .title { height: auto; white-space: normal; margin-bottom: 8px; }
  .chart { height: 430px; }
  .top { position: static; align-items: flex-start; flex-direction: column; }
  .top-tools { justify-content: flex-start; }
}
@media (max-width: 600px) {
  .history-panel { align-items: flex-start; flex-wrap: wrap; }
  .history-status { flex-basis: 100%; margin-left: 0; }
  .rolling-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
  .product h2 { padding-left: 12px; font-size: 27px; }
  .product-footer { align-items: flex-start; flex-direction: column; gap: 5px; }
  .country-trend-heading { gap: 12px; }
  .country-trend-title { font-size: 20px; }
  .country-trend-legend { justify-content: flex-start; gap: 10px 16px; font-size: 12px; }
  .country-trend-scroll { overflow: visible; }
  .country-trend-board { min-width: 0; }
  .country-trend-columns { display: none; }
  .country-trend-row { grid-template-columns: 1fr 1.65fr; min-height: 0; }
  .trend-country, .trend-brands { min-height: 52px; padding: 7px; border-bottom: 1px solid #d1dce3; }
  .trend-country { grid-column: 1; grid-row: 1; font-size: 16px; }
  .trend-brands { grid-column: 2; grid-row: 1; border-right: 0; font-size: 14px; }
  .trend-main { grid-column: 1 / -1; grid-row: 2; padding-top: 6px; border-right: 0; }
  .country-trend-chart { height: 205px; }
  .year-average-strip { margin: 0 48px 0 42px; }
  .year-average span, .year-average b { font-size: 9px; }
  .trend-kpi { min-height: 54px; border-top: 1px solid #d1dce3; }
  .trend-main + .trend-kpi { grid-column: 1; grid-row: 3; }
  .trend-kpi:last-child { grid-column: 2; grid-row: 3; border-right: 0; }
}
@page { size: A4 landscape; margin: 8mm; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html { scroll-behavior: auto; }
  body { background: #fff; }
  .page { max-width: none; padding: 0; }
  .top { display: none; }
  .product { margin: 0; padding-top: 0; break-before: page; scroll-margin-top: 0; }
  .product:first-child { break-before: auto; }
  .product h2 { margin-bottom: 10px; padding: 0 0 7px 10px; font-size: 24px; line-height: 1.15; }
  .grid { grid-template-columns: 16% 30% minmax(0, 1fr); gap: 10px; break-inside: avoid; }
  .panel + .panel { border-left: 1px solid #003b68; border-top: 0; padding-top: 0; padding-left: 10px; }
  .title, .rolling-title { height: auto; margin-bottom: 4px; font-size: 14px; white-space: normal; }
  .chart { height: 330px; }
  .rolling-panel, .country-trend-panel { margin-top: 12px; padding-top: 10px; }
  .rolling-table-wrap, .country-trend-scroll { overflow: visible; }
  .rolling-table { min-width: 0; font-size: 8px; }
  .rolling-table th, .rolling-table td { height: 20px; padding: 2px 4px; }
  .rolling-table thead th, .rolling-table thead .summary-head { font-size: 9px; }
  .rolling-table .country-cn { width: 58px; font-size: 8px; }
  .rolling-table .country-en { left: 58px; width: 92px; font-size: 8px; }
  .country-trend-title { font-size: 16px; }
  .country-trend-legend { gap: 10px; font-size: 9px; }
  .country-trend-columns { display: grid; }
  .country-trend-board { min-width: 0; }
  .country-trend-columns, .country-trend-row { grid-template-columns: 66px 104px minmax(0, 1fr) 72px 62px; }
  .country-trend-row { min-height: 170px; break-inside: avoid; }
  .trend-country, .trend-brands, .trend-main, .trend-main + .trend-kpi, .trend-kpi:last-child { grid-column: auto; grid-row: auto; }
  .trend-country { font-size: 11px; }
  .trend-brands { font-size: 9px; }
  .country-trend-chart { height: 122px; }
  .year-average-strip { margin: 0 42px 0 35px; }
  .year-average span, .year-average b { font-size: 7px; }
  .trend-kpi { font-size: 10px; }
  .trend-kpi small { font-size: 7px; }
  .product-footer { margin-top: 12px; padding: 7px 0 0; font-size: 8px; }
}
</style>
</head>

const updatedDate = '2026/09/08';
const root = document.getElementById('root');
const fmt = v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmt2 = v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
const pct = v => `${Math.round(v * 100)}%`;
const fmtMt = v => Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
const pct1 = v => `${(Number(v) * 100).toFixed(1)}%`;
const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function rollingPeriodTitle(period) {
  const match = String(period).match(/^(F\d{2})\s+(\d{2})$/);
  if (!match) return `${period} Rolling 12 months`;
  return `${match[1]} ${monthNames[Number(match[2]) - 1]} Rolling 12 months`;
}

function makeRollingTable(p, rolling = p.rolling) {
  const periods = rolling.periods;
  const firstIndex = Math.max(0, periods.length - 2);
  const indexes = periods.map((_, i) => i).slice(firstIndex);
  const tones = ['previous', 'latest'];
  const groupRows = new Set(['Total', '大洋洲', '欧洲', '美洲', '亚洲']);
  const valueHeaders = indexes.map((index, slot) => `<th colspan="2" class="period-head tone-${tones[slot]}">${rollingPeriodTitle(periods[index])}</th>`).join('');
  const changeHeaders = indexes.map((index, slot) => `<th colspan="2" class="period-head tone-change-${tones[slot]}">${rollingPeriodTitle(periods[index])}</th>`).join('');
  const valueSubheads = indexes.map((_, slot) => `<th class="subhead tone-${tones[slot]}">MT</th><th class="subhead tone-${tones[slot]}">%</th>`).join('');
  const changeSubheads = indexes.map((_, slot) => `<th class="subhead tone-change-${tones[slot]}">增量 MT</th><th class="subhead tone-change-${tones[slot]}">同比%</th>`).join('');
  const body = rolling.rows.map(row => {
    const rowClass = groupRows.has(row.label) ? 'group-row' : '';
    const values = indexes.map((index, slot) => {
      const tone = tones[slot];
      const share = Math.max(0, Math.min(100, row.shares[index] * 100));
      return `<td class="metric value-${tone}">${fmtMt(row.values[index])}</td><td class="metric percent share-cell value-${tone}" style="--share:${share}%"><span>${pct1(row.shares[index])}</span></td>`;
    }).join('');
    const changes = indexes.map((index, slot) => {
      const tone = tones[slot];
      const increment = row.increments[index];
      const growth = row.growth[index];
      const signClass = growth < 0 ? 'negative' : growth > 0 ? 'positive' : '';
      return `<td class="metric change-${tone} ${signClass}">${increment == null ? '—' : fmtMt(increment)}</td><td class="metric percent change-${tone} ${signClass}">${growth == null ? '—' : pct1(growth)}</td>`;
    }).join('');
    return `<tr class="${rowClass}"><td class="country-cn">${row.label}</td><td class="country-en">${row.country}</td>${values}${changes}</tr>`;
  }).join('');
  return `<div class="rolling-table-wrap"><table class="rolling-table"><thead><tr><th rowspan="2" colspan="2" class="summary-head">China Import<br>Data Summary</th>${valueHeaders}${changeHeaders}</tr><tr>${valueSubheads}${changeSubheads}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function makeCountryTrends(p) {
  const trend = p.countryTrends;
  const [year, month] = trend.latestMonth.split('-').map(Number);
  const rows = trend.countries.map((country, index) => {
    const price = country.latestPrice == null ? 'N.A.' : fmtMt(country.latestPrice);
    const yoy = country.priceYoy == null ? 'N.A.' : `${country.priceYoy > 0 ? '+' : ''}${pct1(country.priceYoy)}`;
    const yoyClass = country.priceYoy == null ? '' : country.priceYoy < 0 ? 'negative' : 'positive';
    const averages = country.yearAverages.map(item => `<div class="year-average" style="flex:${item.months}"><span>${item.year}</span><b>↔ ${fmt(item.avgMt)} 吨</b></div>`).join('');
    const brands = country.brands.map(brand => `<span>${brand}</span>`).join('');
    return `<div class="country-trend-row"><div class="trend-country">${country.zh}</div><div class="trend-brands">${brands}</div><div class="trend-main"><div id="${p.key}-country-${index}" class="country-trend-chart"></div><div class="year-average-strip">${averages}</div></div><div class="trend-kpi"><strong>${price}</strong><small>美元/吨</small></div><div class="trend-kpi ${yoyClass}"><strong>${yoy}</strong><small>同比</small></div></div>`;
  }).join('');
  return `<div id="${p.key}-country-trends" class="country-trend-panel"><div class="country-trend-heading"><div class="country-trend-title">${year}年${month}月${p.zh}主要来源国进口量及价格走势</div><div class="country-trend-legend"><span><i class="legend-bar"></i>月度进口量（吨，左轴）</span><span><i class="legend-line"></i>月度平均进口价格（美元/吨，右轴）</span><span><i class="legend-average">↔</i>各年度月均进口量（吨）</span></div></div><div class="country-trend-scroll"><div class="country-trend-board"><div class="country-trend-columns"><div>国家</div><div>主要品牌</div><div>月度量价走势</div><div>最新均价</div><div>价格同比</div></div>${rows}</div></div></div>`;
}

function makeSection(p) {
  const section = document.createElement('section');
  section.className = 'product';
  section.id = p.key;
  section.innerHTML = `<h2>${p.zh}进口分析</h2><div class="grid">
    <div class="panel"><div class="title">年度进口量，千吨</div><div id="${p.key}-annual" class="chart"></div></div>
    <div class="panel"><div class="title">月度${p.zh}进口总量变化，千吨</div><div id="${p.key}-monthly" class="chart"></div></div>
    <div class="panel"><div class="title">近12个月${p.zh}进口来源占比，%</div><div id="${p.key}-stacked" class="chart"></div></div>
  </div><div class="rolling-panel"><div class="rolling-heading"><div class="rolling-title">Rolling 12个月进口数据汇总</div><div id="${p.key}-rolling-period" class="rolling-period">截止 ${p.latestMonth}</div></div><div id="${p.key}-rolling-table">${makeRollingTable(p)}</div></div>${p.countryTrends ? makeCountryTrends(p) : ''}<footer class="product-footer"><span>Source: CDI data</span><span>最近更新日期：${updatedDate}</span></footer>`;
  root.appendChild(section);
}

function drawAnnual(p) {
  const chart = echarts.init(document.getElementById(`${p.key}-annual`));
  chart.setOption({
    animation: false,
    grid: { left: 70, right: 40, top: 70, bottom: 75 },
    tooltip: { trigger: 'item', formatter: d => `<b>${p.zh} ${d.name}</b><br/>年度进口量：${fmt(d.value)} 千吨` },
    xAxis: { type: 'value', show: false, max: value => value.max * 1.32 },
    yAxis: { type: 'category', inverse: true, axisLine: { show: true, lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#003b68', fontSize: 14, formatter: v => v.replace('YTD', `YTD
(${p.latestMonthShort})`) }, data: p.annual.map(d => d.label) },
    series: [{ type: 'bar', data: p.annual.map(d => d.kmt), barWidth: 44, itemStyle: { color: '#003b68' }, label: { show: true, position: 'right', color: '#003b68', fontSize: 20, formatter: d => fmt(d.value) } }]
  });
  return chart;
}

function drawMonthly(p) {
  const chart = echarts.init(document.getElementById(`${p.key}-monthly`));
  const colors = ['#003b68', '#9ddbdd', '#f4a36b'];
  chart.setOption({
    animation: false,
    color: colors,
    grid: { left: 48, right: 8, top: 55, bottom: 55 },
    tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '' : fmt2(v) },
    legend: { top: 2, itemWidth: 30, itemHeight: 4, textStyle: { color: '#003b68', fontSize: 20 }, data: p.years.map(String) },
    xAxis: { type: 'category', boundaryGap: false, axisLine: { lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#565656', fontSize: 18 }, data: Array.from({length: 12}, (_, i) => String(i + 1)) },
    yAxis: { type: 'value', min: 0, max: value => Math.max(40, Math.ceil(value.max / 10) * 10), interval: 10, axisLine: { show: true, lineStyle: { color: '#222' } }, axisLabel: { color: '#565656', fontSize: 18 }, splitLine: { show: false } },
    series: p.years.map((year, i) => ({ name: String(year), type: 'line', symbolSize: 8, showSymbol: false, connectNulls: false, lineStyle: { width: 4, color: colors[i] }, itemStyle: { color: colors[i] }, data: p.monthly.map(d => d[String(year)]) }))
  });
  return chart;
}

function drawStacked(p) {
  const chart = echarts.init(document.getElementById(`${p.key}-stacked`));
  const months = p.stacked.map(d => d.month.replace('-', ''));
  const series = p.categories.map(cat => ({
    name: cat.name,
    type: 'bar',
    stack: 'total',
    barWidth: 34,
    itemStyle: { color: cat.color },
    label: { show: true, color: cat.name === 'New Zealand' ? '#fff' : '#003b68', fontSize: 16, formatter: d => d.data.share > 0.05 ? pct(d.data.share) : '' },
    emphasis: { focus: 'series' },
    data: p.stacked.map(m => {
      const part = m.parts.find(x => x.name === cat.name) || { kmt: 0, share: 0 };
      return { value: part.kmt, share: part.share, month: m.month, totalKmt: m.totalKmt };
    })
  }));
  series.push({ name: 'Total', type: 'bar', barGap: '-100%', barWidth: 34, silent: true, itemStyle: { color: 'transparent' }, label: { show: true, position: 'top', color: '#003b68', fontSize: 20, formatter: d => fmt(d.value) }, data: p.stacked.map(d => d.totalKmt) });
  chart.setOption({
    animation: false,
    grid: { left: 12, right: 10, top: 62, bottom: 55 },
    legend: { top: 2, left: 0, itemWidth: 23, itemHeight: 17, textStyle: { color: '#003b68', fontSize: 15 }, data: p.categories.map(c => c.name) },
    tooltip: { trigger: 'item', formatter: d => d.seriesName === 'Total' ? '' : `<b>${d.data.month} ${d.seriesName}</b><br/>进口量：${fmt2(d.value)} 千吨<br/>占比：${pct(d.data.share)}<br/>总量：${fmt(d.data.totalKmt)} 千吨` },
    xAxis: { type: 'category', axisLine: { lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#003b68', fontSize: 20, interval: 2 }, data: months },
    yAxis: { type: 'value', show: false },
    series
  });
  return chart;
}

function drawCountryTrends(p) {
  const trend = p.countryTrends;
  const yearBoundaries = trend.months.slice(1).filter(month => month.endsWith('-01'));
  return trend.countries.map((country, index) => {
    const chart = echarts.init(document.getElementById(`${p.key}-country-${index}`));
    chart.setOption({
      animation: false,
      grid: { left: 48, right: 58, top: 16, bottom: 25 },
      tooltip: {
        trigger: 'axis',
        confine: true,
        formatter: items => {
          const month = items[0].axisValue;
          const volume = items.find(item => item.seriesName === '月度进口量');
          const price = items.find(item => item.seriesName === '月度平均进口价格');
          return `<b>${country.zh} ${month}</b><br/>月度进口量：${fmt2(volume.value)} 吨<br/>月度平均进口价格：${price.value == null ? 'N.A.' : `${fmt2(price.value)} 美元/吨`}`;
        }
      },
      xAxis: {
        type: 'category',
        data: trend.months,
        boundaryGap: true,
        axisLine: { lineStyle: { color: '#6f7d85' } },
        axisTick: { show: false },
        axisLabel: { color: '#65737c', fontSize: 10, interval: 0, formatter: value => ['01', '04', '07', '10'].includes(value.slice(5)) ? String(Number(value.slice(5))) : '' }
      },
      yAxis: [
        {
          type: 'value',
          name: '吨',
          nameTextStyle: { color: '#315065', fontSize: 10, padding: [0, 0, 0, -18] },
          min: 0,
          axisLine: { show: true, lineStyle: { color: '#6f7d85' } },
          axisTick: { show: false },
          axisLabel: { color: '#315065', fontSize: 10 },
          splitLine: { show: false }
        },
        {
          type: 'value',
          name: '美元/吨',
          nameTextStyle: { color: '#555b60', fontSize: 10, padding: [0, -12, 0, 0] },
          min: value => Math.max(0, Math.floor(value.min / 500) * 500 - 500),
          max: value => Math.ceil(value.max / 500) * 500 + 500,
          axisLine: { show: true, lineStyle: { color: '#6f7d85' } },
          axisTick: { show: false },
          axisLabel: { color: '#555b60', fontSize: 10 },
          splitLine: { show: false }
        }
      ],
      series: [
        {
          name: '月度进口量',
          type: 'bar',
          yAxisIndex: 0,
          data: country.volumes,
          barMaxWidth: 12,
          itemStyle: { color: '#0b4a75' },
          markLine: {
            silent: true,
            symbol: 'none',
            label: { show: false },
            lineStyle: { color: '#4f83a3', type: 'dashed', width: 1 },
            data: yearBoundaries.map(value => ({ xAxis: value }))
          }
        },
        {
          name: '月度平均进口价格',
          type: 'line',
          yAxisIndex: 1,
          data: country.prices,
          showSymbol: false,
          connectNulls: false,
          lineStyle: { color: '#555b60', width: 2.5 },
          itemStyle: { color: '#555b60' },
          z: 3
        }
      ]
    });
    return chart;
  });
}

const charts = [];
products.forEach(p => {
  makeSection(p);
  charts.push(drawAnnual(p), drawMonthly(p), drawStacked(p));
  if (p.countryTrends) charts.push(...drawCountryTrends(p));
});

const rollingMonths = Object.keys(products[0].rollingHistory)
  .filter(month => products.every(p => p.rollingHistory[month]))
  .sort();
const latestRollingMonth = rollingMonths[rollingMonths.length - 1];
const historyToggle = document.getElementById('history-toggle');
const historyPanel = document.getElementById('history-panel');
const rollingMonthInput = document.getElementById('rolling-month-input');
const applyHistoryButton = document.getElementById('apply-history');
const resetHistoryButton = document.getElementById('reset-history');
const historyStatus = document.getElementById('history-status');
const exportPdfButton = document.getElementById('export-pdf');

rollingMonthInput.min = rollingMonths[0];
rollingMonthInput.max = latestRollingMonth;
rollingMonthInput.value = latestRollingMonth;

function applyRollingMonth(month) {
  if (!rollingMonths.includes(month)) {
    historyStatus.textContent = `请选择 ${rollingMonths[0]} 至 ${latestRollingMonth} 之间的月份`;
    return;
  }
  products.forEach(p => {
    const rolling = p.rollingHistory[month];
    document.getElementById(`${p.key}-rolling-table`).innerHTML = makeRollingTable(p, rolling);
    document.getElementById(`${p.key}-rolling-period`).textContent = `截止 ${month}`;
  });
  rollingMonthInput.value = month;
  historyStatus.textContent = `当前 Rolling 截止月：${month}`;
}

historyToggle.addEventListener('click', () => {
  const isOpen = !historyPanel.hidden;
  historyPanel.hidden = isOpen;
  historyToggle.setAttribute('aria-expanded', String(!isOpen));
  if (!isOpen) rollingMonthInput.focus();
});
applyHistoryButton.addEventListener('click', () => applyRollingMonth(rollingMonthInput.value));
resetHistoryButton.addEventListener('click', () => applyRollingMonth(latestRollingMonth));
rollingMonthInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') applyRollingMonth(rollingMonthInput.value);
});

const originalTitle = document.title;
exportPdfButton.addEventListener('click', () => {
  document.title = `进口数据报告_${rollingMonthInput.value.replace('-', '')}`;
  charts.forEach(chart => chart.resize());
  window.print();
});
window.addEventListener('beforeprint', () => charts.forEach(chart => chart.resize()));
window.addEventListener('afterprint', () => {
  document.title = originalTitle;
  charts.forEach(chart => chart.resize());
});
window.addEventListener('resize', () => charts.forEach(c => c.resize()));
</script>
