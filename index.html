function rollingPeriodTitle(period) {
  const match = String(period).match(/^(F\d{2})\s+(\d{2})$/);
  if (!match) return `${period} Rolling 12 months`;
  return `${match[1]} ${monthNames[Number(match[2]) - 1]} Rolling 12 months`;
}

function makeRollingTable(p) {
  const periods = p.rolling.periods;
  const firstIndex = Math.max(0, periods.length - 2);
  const indexes = periods.map((_, i) => i).slice(firstIndex);
  const tones = ['previous', 'latest'];
  const groupRows = new Set(['Total', '&#22823;&#27915;&#27954;', '&#27431;&#27954;', '&#32654;&#27954;', '&#20122;&#27954;']);
  const valueHeaders = indexes.map((index, slot) => `<th colspan="2" class="period-head tone-${tones[slot]}">${rollingPeriodTitle(periods[index])}</th>`).join('');
  const changeHeaders = indexes.map((index, slot) => `<th colspan="2" class="period-head tone-change-${tones[slot]}">${rollingPeriodTitle(periods[index])}</th>`).join('');
  const valueSubheads = indexes.map((_, slot) => `<th class="subhead tone-${tones[slot]}">MT</th><th class="subhead tone-${tones[slot]}">%</th>`).join('');
  const changeSubheads = indexes.map((_, slot) => `<th class="subhead tone-change-${tones[slot]}">&#22686;&#37327; MT</th><th class="subhead tone-change-${tones[slot]}">&#21516;&#27604;%</th>`).join('');
  const body = p.rolling.rows.map(row => {
    const rowClass = groupRows.has(row.label) ? 'group-row' : '';
    const values = indexes.map((index, slot) => {
      const tone = tones[slot];
      const share = Math.max(0, Math.min(100, row.shares[index] * 100));
      return `<td class="metric value-${tone}">${fmtMt(row.values[index])}</td><td class="metric percent share-cell value-${tone}" style="--share:${share}%"><span>${pct1(row.shares[index])}</span></td>`;
    }).join('');
    const changes = indexes.map((index, slot) => {
      const tone = tones[slot];
      const increment = row.increments[index];
      const growth = row.growth[index];
      const signClass = growth < 0 ? 'negative' : growth > 0 ? 'positive' : '';
      return `<td class="metric change-${tone} ${signClass}">${increment == null ? '&#8212;' : fmtMt(increment)}</td><td class="metric percent change-${tone} ${signClass}">${growth == null ? '&#8212;' : pct1(growth)}</td>`;
    }).join('');
    return `<tr class="${rowClass}"><td class="country-cn">${row.label}</td><td class="country-en">${row.country}</td>${values}${changes}</tr>`;
  }).join('');
  return `<div class="rolling-table-wrap"><table class="rolling-table"><thead><tr><th rowspan="2" colspan="2" class="summary-head">China Import<br>Data Summary</th>${valueHeaders}${changeHeaders}</tr><tr>${valueSubheads}${changeSubheads}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function makeCountryTrends(p) {

    grid: { left: 12, right: 10, top: 62, bottom: 55 },
    legend: { top: 2, left: 0, itemWidth: 23, itemHeight: 17, textStyle: { color: '#003b68', fontSize: 15 }, data: p.categories.map(c => c.name) },
    tooltip: { trigger: 'item', formatter: d => d.seriesName === 'Total' ? '' : `<b>${d.data.month} ${d.seriesName}</b><br/>&#36827;&#21475;&#37327;&#65306;${fmt2(d.value)} &#21315;&#21544;<br/>&#21344;&#27604;&#65306;${pct(d.data.share)}<br/>&#24635;&#37327;&#65306;${fmt(d.data.totalKmt)} &#21315;&#21544;` },
    xAxis: { type: 'category', axisLine: { lineStyle: { color: '#222' } }, axisTick: { show: false }, axisLabel: { color: '#003b68', fontSize: 20, interval: 2 }, data: months },
    yAxis: { type: 'value', show: false },
    series
  });
  return chart;
}

function drawCountryTrends(p) {
  const trend = p.countryTrends;
  const yearBoundaries = trend.months.slice(1).filter(month => month.endsWith('-01'));
  return trend.countries.map((country, index) => {
    const chart = echarts.init(document.getElementById(`${p.key}-country-${index}`));
    chart.setOption({
      animation: false,
      grid: { left: 48, right: 58, top: 16, bottom: 25 },
      tooltip: {
        trigger: 'axis',
        confine: true,
        formatter: items => {
          const month = items[0].axisValue;
          const volume = items.find(item => item.seriesName === '&#26376;&#24230;&#36827;&#21475;&#37327;');
          const price = items.find(item => item.seriesName === '&#26376;&#24230;&#24179;&#22343;&#36827;&#21475;&#20215;&#26684;');
          return `<b>${country.zh} ${month}</b><br/>&#26376;&#24230;&#36827;&#21475;&#37327;&#65306;${fmt2(volume.value)} &#21544;<br/>&#26376;&#24230;&#24179;&#22343;&#36827;&#21475;&#20215;&#26684;&#65306;${price.value == null ? 'N.A.' : `${fmt2(price.value)} &#32654;&#20803;/&#21544;`}`;
        }
      },
      xAxis: {
        type: 'category',
        data: trend.months,
        boundaryGap: true,
        axisLine: { lineStyle: { color: '#6f7d85' } },
        axisTick: { show: false },
        axisLabel: { color: '#65737c', fontSize: 10, interval: 0, formatter: value => ['01', '04', '07', '10'].includes(value.slice(5)) ? String(Number(value.slice(5))) : '' }
      },
      yAxis: [
        {
          type: 'value',
          name: '&#21544;',
          nameTextStyle: { color: '#315065', fontSize: 10, padding: [0, 0, 0, -18] },
          min: 0,
          axisLine: { show: true, lineStyle: { color: '#6f7d85' } },
          axisTick: { show: false },
          axisLabel: { color: '#315065', fontSize: 10 },
          splitLine: { show: false }
        },
        {
          type: 'value',
          name: '&#32654;&#20803;/&#21544;',
          nameTextStyle: { color: '#555b60', fontSize: 10, padding: [0, -12, 0, 0] },
          min: value => Math.max(0, Math.floor(value.min / 500) * 500 - 500),
          max: value => Math.ceil(value.max / 500) * 500 + 500,
          axisLine: { show: true, lineStyle: { color: '#6f7d85' } },
          axisTick: { show: false },
          axisLabel: { color: '#555b60', fontSize: 10 },
          splitLine: { show: false }
        }
      ],
      series: [
        {
          name: '&#26376;&#24230;&#36827;&#21475;&#37327;',
          type: 'bar',
          yAxisIndex: 0,
          data: country.volumes,
          barMaxWidth: 12,
          itemStyle: { color: '#0b4a75' },
          markLine: {
            silent: true,
            symbol: 'none',
            label: { show: false },
            lineStyle: { color: '#4f83a3', type: 'dashed', width: 1 },
            data: yearBoundaries.map(value => ({ xAxis: value }))
          }
        },
        {
          name: '&#26376;&#24230;&#24179;&#22343;&#36827;&#21475;&#20215;&#26684;',
          type: 'line',
          yAxisIndex: 1,
          data: country.prices,
          showSymbol: false,
          connectNulls: false,
          lineStyle: { color: '#555b60', width: 2.5 },
          itemStyle: { color: '#555b60' },
          z: 3
        }
      ]
    });
    return chart;
  });
}

const charts = [];
products.forEach(p => {
  makeSection(p);
  charts.push(drawAnnual(p), drawMonthly(p), drawStacked(p));
  if (p.countryTrends) charts.push(...drawCountryTrends(p));
});
window.addEventListener('resize', () => charts.forEach(c => c.resize()));
</script>
</body>
</html>
